<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>SNSレポート（自分用）</title><style>
  :root { --bg:#f3f4f7; --panel:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e4e6eb; --accent:#1d2330; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121419; --panel:#1c1f26; --fg:#e9eaee; --muted:#9aa1ad; --line:#2d313a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif; line-height:1.65; }
  .hero { background:var(--accent); color:#fff; padding:26px 16px 22px; }
  .hero > div, main, .nav > div { max-width:1180px; margin:0 auto; }
  .hero h1 { margin:0; font-size:1.55rem; letter-spacing:.02em; }
  .hero p { margin:6px 0 0; opacity:.92; font-size:.92rem; }
  .hero .links { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .hero .links a { color:#fff; text-decoration:none; font-size:.8rem; padding:3px 11px; border:1px solid rgba(255,255,255,.6); border-radius:999px; }
  .nav { position:sticky; top:0; z-index:9; background:var(--panel); border-bottom:1px solid var(--line); }
  .nav > div { display:flex; gap:4px; overflow-x:auto; padding:8px 16px; }
  .nav a { white-space:nowrap; text-decoration:none; color:var(--fg); font-size:.84rem; padding:5px 12px; border-radius:8px; }
  .nav a:hover { background:var(--bg); }
  .nav a.home { color:var(--accent); font-weight:700; }
  main { padding:16px 16px 56px; display:grid; gap:18px; }
  .sec-title { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:10px 0 -4px; }
  .sec-title h2 { margin:0; font-size:1.2rem; }
  .sec-title span { color:var(--muted); font-size:.85rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card h3 { margin:0 0 2px; font-size:1rem; }
  .muted { color:var(--muted); font-size:.85rem; margin:0 0 8px; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
  .grid3 { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
  .grid > div, .grid3 > div { min-width:0; }
  .kpis { display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 14px 14px 18px; position:relative; overflow:hidden; }
  .kpi::before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:var(--c); }
  .kpi .head { display:flex; align-items:center; gap:8px; font-weight:700; }
  .kpi .head .dot, .mini-head .dot { width:22px; height:22px; border-radius:6px; background:var(--c); color:#fff; display:grid; place-items:center; font-size:.75rem; }
  .kpi .big { font-size:1.9rem; font-weight:800; line-height:1.15; margin-top:6px; }
  .kpi .sub { font-size:.78rem; color:var(--muted); }
  .kpi .rows { display:grid; grid-template-columns:1fr auto; gap:2px 8px; font-size:.82rem; margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; }
  .kpi .rows b { font-variant-numeric:tabular-nums; }
  .up { color:#1a9b62; } .down { color:#d64545; }
  .chart { position:relative; height:270px; } .chart.sm { height:220px; }
  .mini-head { display:flex; align-items:center; gap:6px; font-weight:700; margin-bottom:4px; }
  select { font:inherit; font-size:.85rem; padding:4px 8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; }
  th { text-align:left; color:var(--muted); font-weight:600; border-bottom:2px solid var(--line); padding:6px; white-space:nowrap; }
  td { border-bottom:1px solid var(--line); padding:7px 6px; vertical-align:top; }
  td a { color:inherit; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .badge { display:inline-block; font-size:.72rem; color:#fff; border-radius:6px; padding:1px 7px; background:var(--c); white-space:nowrap; }
  .funnel .step { display:grid; grid-template-columns:96px 1fr; align-items:center; gap:8px; margin:6px 0; font-size:.86rem; }
  .funnel .bar { height:26px; border-radius:7px; background:var(--accent); color:#fff; font-size:.8rem; display:flex; align-items:center; padding:0 8px; white-space:nowrap; }
  .strategy h3 { margin:14px 0 4px; font-size:1rem; } .strategy ul { margin:4px 0; padding-left:1.2em; }
  .roles { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }

  .acc { display:block; text-decoration:none; color:var(--fg); border-radius:16px; overflow:hidden; border:1px solid var(--line); background:var(--panel); box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .acc .top { padding:18px; color:#fff; background:var(--c); }
  .acc .top h2 { margin:0; font-size:1.3rem; } .acc .top p { margin:6px 0 0; font-size:.88rem; opacity:.95; }
  .acc .nums { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:14px 18px; }
  .acc .nums b { display:block; font-size:1.5rem; } .acc .nums span { font-size:.78rem; color:var(--muted); }
  .acc .chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 16px; }
  .acc .chips span { font-size:.78rem; border-radius:999px; padding:2px 10px; color:#fff; background:var(--m); }
  .acc .go { padding:10px 18px; border-top:1px solid var(--line); font-weight:700; color:var(--c); }
</style></head>
<body>
<div class="hero"><div><h1>SNSレポート（自分用）</h1><p>集計日 2026-10-30 ／ 今週 2026-10-23〜2026-10-29</p>
<p>個人アカウントと寺子屋365の数字を、方向性と戦略を考えるためにまとめたもの。会社アカウントの報告とは別。</p></div></div>
<main><div class="roles" id="cards"></div></main>
<script>
const C = [{"key": "kojin", "group": "個人アカウント", "purpose": "明石を<b>三木市</b>で知ってもらい、ファンを作る。入口はInstagram（三木市の歴史・お店）、思想はThreads・note。三木市の外は追わない。", "followers": 2931.0, "posts": 169, "week": 4, "views": 1645857.0, "media": [{"name": "Instagram", "color": "#E1306C", "f": 1578.0}, {"name": "Threads", "color": "#6B6B6B", "f": 1327.0}, {"name": "Facebook", "color": "#1877F2", "f": null}, {"name": "note", "color": "#2CB696", "f": 26.0}]}, {"key": "terakoya", "group": "寺子屋365", "purpose": "<b>会社アカウントのための媒体の試験</b>（AIで量産し、媒体ごとの使い方と反応を確かめる）と、保守層への認知拡大。", "followers": 231.0, "posts": 76, "week": 64, "views": 163889.0, "media": [{"name": "YouTube", "color": "#FF0000", "f": 44.0}, {"name": "Instagram", "color": "#E1306C", "f": 25.0}, {"name": "Facebook", "color": "#1877F2", "f": 151.0}, {"name": "TikTok", "color": "#25B8C9", "f": 11.0}, {"name": "Threads", "color": "#6B6B6B", "f": 0.0}]}];
const fmt = (v) => v == null ? '—' : Math.round(v).toLocaleString('ja-JP');
document.getElementById('cards').innerHTML = C.map((c) => `<a class="acc" href="${c.key}.html" style="--c:${c.key === 'kojin' ? '#2f6fb0' : '#b3541e'}">
  <div class="top"><h2>${c.group}</h2><p>${c.purpose}</p></div>
  <div class="nums"><div><b>${fmt(c.followers)}</b><span>フォロワーの合計</span></div><div><b>${fmt(c.views)}</b><span>累計の再生・閲覧</span></div><div><b>${c.week}</b><span>今週の本数</span></div></div>
  <div class="chips">${c.media.map((m) => `<span style="--m:${m.color}">${m.name} ${fmt(m.f)}</span>`).join('')}</div>
  <div class="go">くわしく見る →</div></a>`).join('');
</script></body></html>
